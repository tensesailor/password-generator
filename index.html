<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Password Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; font-size: 16px; }
    button { padding: 10px 15px; font-size: 16px; width: 100%; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:active { background-color: #0056b3; }
    .result-box { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px; text-align: center; word-break: break-all; }
    #output { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Password Generator</h2>
  
  <div class="input-group">
    <label for="masterSecret">Master Secret</label>
    <!-- type="password" hides the input so it isn't shoulder-surfed -->
    <input type="password" id="masterSecret" placeholder="Your master passphrase">
  </div>
  
  <div class="input-group">
    <label for="identifier">Site Identifier</label>
    <!-- autocapitalize="none" prevents iOS from capitalizing the first letter -->
    <input type="text" id="identifier" placeholder="e.g., github.com1" autocapitalize="none" autocomplete="off">
  </div>

  <div class="input-group">
    <label for="accountIdentifier">Email or Username</label>
    <input type="text" id="accountIdentifier" placeholder="Email or username for this account" autocapitalize="none" autocomplete="username">
  </div>

  <div class="input-group">
    <label for="version">Password Reset Count</label>
    <input type="number" id="version" value="0" min="0" step="1">
  </div>

  <div class="input-group">
    <label for="length">Password Length</label>
    <input type="number" id="length" value="16" min="8" max="64">
  </div>

  <fieldset class="input-group">
    <legend>Minimum character requirements</legend>
    <p>These settings are part of the generated password. Keep them the same to regenerate it.</p>
    <div class="input-group">
      <label for="lowercaseCount">Lowercase letters</label>
      <input type="number" id="lowercaseCount" value="1" min="0" max="64" step="1">
    </div>
    <div class="input-group">
      <label for="uppercaseCount">Uppercase letters</label>
      <input type="number" id="uppercaseCount" value="1" min="0" max="64" step="1">
    </div>
    <div class="input-group">
      <label for="numberCount">Numbers</label>
      <input type="number" id="numberCount" value="1" min="0" max="64" step="1">
    </div>
    <div class="input-group">
      <label for="symbolCount">Symbols</label>
      <input type="number" id="symbolCount" value="1" min="0" max="64" step="1">
    </div>
  </fieldset>

  <button onclick="runGenerator()">Generate Password</button>
  
  <div class="result-box">
    <p style="margin: 0 0 10px 0;">Result:</p>
    <span id="output">(waiting)</span>
  </div>

  <script>
    /**
     * Generates a deterministic password using Web Crypto API.
     * Must be run in a secure context (HTTPS or localhost).
     */
    async function generateSecurePassword(masterSecret, siteIdentifier, accountIdentifier, version, length = 16, requirements = {}) {
      const enc = new TextEncoder();
      const { lowercase = 1, uppercase = 1, numbers = 1, symbols = 1 } = requirements;
      const salt = JSON.stringify([
        "password-generator-v2",
        siteIdentifier,
        accountIdentifier,
        version,
        length,
        lowercase,
        uppercase,
        numbers,
        symbols
      ]);
      
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        enc.encode(masterSecret),
        { name: "PBKDF2" },
        false,
        ["deriveBits"]
      );

      const derivedBuffer = await window.crypto.subtle.deriveBits(
        {
          name: "PBKDF2",
          salt: enc.encode(salt),
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        32768
      );

      const randomBytes = new Uint8Array(derivedBuffer);
      let byteIndex = 0;
      const sampleBelow = (limit) => {
        const cutoff = Math.floor(256 / limit) * limit;
        while (byteIndex < randomBytes.length) {
          const value = randomBytes[byteIndex++];
          if (value < cutoff) return value % limit;
        }
        throw new Error("Unable to generate enough random bytes.");
      };
      const pick = (characters) => characters[sampleBelow(characters.length)];
      const lowercaseCharacters = "abcdefghijklmnopqrstuvwxyz";
      const uppercaseCharacters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const numberCharacters = "0123456789";
      const symbolCharacters = "!@#$%^&*()-_=+";
      const allCharacters = lowercaseCharacters + uppercaseCharacters + numberCharacters + symbolCharacters;
      const passwordCharacters = [];

      for (let i = 0; i < lowercase; i++) passwordCharacters.push(pick(lowercaseCharacters));
      for (let i = 0; i < uppercase; i++) passwordCharacters.push(pick(uppercaseCharacters));
      for (let i = 0; i < numbers; i++) passwordCharacters.push(pick(numberCharacters));
      for (let i = 0; i < symbols; i++) passwordCharacters.push(pick(symbolCharacters));
      while (passwordCharacters.length < length) passwordCharacters.push(pick(allCharacters));

      for (let i = passwordCharacters.length - 1; i > 0; i--) {
        const swapIndex = sampleBelow(i + 1);
        [passwordCharacters[i], passwordCharacters[swapIndex]] = [passwordCharacters[swapIndex], passwordCharacters[i]];
      }

      randomBytes.fill(0);
      return passwordCharacters.join("");
    }

    async function runGenerator() {
      // 1. Grab values from the UI inputs
      const masterSecret = document.getElementById('masterSecret').value;
      const siteIdentifier = document.getElementById('identifier').value.trim();
      const accountIdentifier = document.getElementById('accountIdentifier').value.trim();
      const versionInput = document.getElementById('version').value;
      const version = Number(versionInput);
      const length = parseInt(document.getElementById('length').value, 10);
      const requirementInputs = {
        lowercase: document.getElementById('lowercaseCount').value,
        uppercase: document.getElementById('uppercaseCount').value,
        numbers: document.getElementById('numberCount').value,
        symbols: document.getElementById('symbolCount').value
      };
      const requirements = {
        lowercase: Number(requirementInputs.lowercase),
        uppercase: Number(requirementInputs.uppercase),
        numbers: Number(requirementInputs.numbers),
        symbols: Number(requirementInputs.symbols)
      };

      // 2. Basic validation
      if (!masterSecret || !siteIdentifier || !accountIdentifier) {
        document.getElementById('output').textContent = "Please enter the secret, site identifier, and email or username.";
        return;
      }

      if (!versionInput.trim() || !Number.isSafeInteger(version) || version < 0) {
        document.getElementById('output').textContent = "Please enter a valid password reset count.";
        return;
      }

      if (!Number.isInteger(length) || length < 8 || length > 64) {
        document.getElementById('output').textContent = "Password length must be between 8 and 64.";
        return;
      }

      if (Object.values(requirementInputs).some((value) => !value.trim()) ||
          Object.values(requirements).some((count) => !Number.isInteger(count) || count < 0 || count > 64)) {
        document.getElementById('output').textContent = "Character requirements must be whole numbers between 0 and 64.";
        return;
      }

      if (Object.values(requirements).reduce((total, count) => total + count, 0) > length) {
        document.getElementById('output').textContent = "The minimum character requirements cannot exceed the password length.";
        return;
      }

      try {
        // 3. Generate and display the password
        document.getElementById('output').textContent = "Generating...";
        const pwd = await generateSecurePassword(masterSecret, siteIdentifier, accountIdentifier, version, length, requirements);
        document.getElementById('output').textContent = pwd;

      } catch (error) {
        console.error("Crypto error:", error);
        document.getElementById('output').textContent = "Error generating password.";
      }
    }
  </script>
</body>
</html>
